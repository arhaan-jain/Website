- id: actuator-networks
  title: Learning actuator dynamics using neural networks for sim-to-real transfer
  context: Undergraduate final-year project · NUS · 2026
  tags: Sim-to-real transfer · System identification · Neural networks · PD control · Isaac Lab
  image: /assets/images/fyp-results.png
  image_link: /assets/images/fyp-results.png
  alt: Commanded and actual forward velocity, lateral velocity, and yaw rate for PD-only and hybrid controllers.
  caption: Comparison of velocity tracking with PD-only control (left) and the actuator-net augmented control (right).
  description: >-
    Built a framework to learn actuator dynamics from real robot data and integrate
    them into policy training. Tested on Unitree Go1 and HEBI Daisy; a hybrid
    controller paired learned actuator models with PD control for the hexapod's
    different limb roles. The hybrid controller <strong> reduced average velocity-tracking error by at least 20%</strong> relative to PD-only control.

- id: pusher
  title: Learning contact-rich pushing using reinforcement learning
  context: Deep Learning for Robotics · NUS · Apr 2025
  tags: Reinforcement learning · PPO · Reward shaping · MuJoCo
  image: /assets/images/pusher.jpg
  video: /assets/videos/pusher.mp4
  caption: Demonstration of the learned policy pushing an object to its target in MuJoCo.
  description: >-
    Developed a custom MuJoCo–Gym environment for a 7-DOF arm and trained a compact
    actor–critic PPO policy with generalized advantage estimation. Structured
    observations, multi-phase rewards, and policy fine-tuning achieved a
    <strong>92.8% success rate over 1,000 evaluation episodes</strong> in the simulated task,
    using CPU-only training.

